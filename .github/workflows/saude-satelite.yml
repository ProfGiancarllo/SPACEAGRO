# Analisa imagens Sentinel-2 dos talhões da fazenda de demonstração e publica public/data/saude-talhoes.json na main.
# O app lê esse arquivo direto da main (raw.githubusercontent.com), sem precisar publicar o site de novo.
name: Saude da lavoura por satelite
on:
  schedule:
    - cron: '17 9 */2 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saude-satelite
  cancel-in-progress: false
jobs:
  analisa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pystac-client planetary-computer odc-stac rasterio shapely pyproj pandas numpy
      - run: python scripts/saude_satelite.py
      - name: Publicar resultado
        run: |
          git config user.name "myroca-bot"
          git config user.email "myroca-bot@users.noreply.github.com"
          git add public/data/saude-talhoes.json
          git diff --cached --quiet && echo "sem mudanca" && exit 0
          git commit -m "Saude por satelite: atualizacao automatica"
          git pull --rebase origin main
          git push origin HEAD:main
