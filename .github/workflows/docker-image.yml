# Gera a imagem Docker do SpaceAgro a cada atualização da main e publica no GitHub Container Registry.
# A stack do Portainer (deploy/portainer-stack.yml) usa ghcr.io/profgiancarllo/myroca:latest.
name: Imagem Docker
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-image
  cancel-in-progress: true
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/profgiancarllo/myroca:latest
            ghcr.io/profgiancarllo/myroca:${{ github.sha }}
          build-args: |
            VITE_ESTELA_URL=https://spaceagro.pro/api
            FRED_API_KEY=${{ secrets.FRED_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
